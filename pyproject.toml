[project]
name = "emotion-vectors"
version = "0.1.0"
description = "Reproduction of Anthropic's emotion-vectors paper on Qwen3.5-4B, with a test of English emotion vectors on other languages"
readme = "README.md"
authors = [
    { name = "amir-braham" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
emotion-vectors = "emotion_vectors:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
